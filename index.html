<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reformulador Profesional</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 2rem;
      max-width: 800px;
      margin: auto;
    }
    textarea {
      width: 100%;
      height: 150px;
      margin-bottom: 1rem;
      padding: 10px;
      font-size: 1rem;
    }
    button {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
    }
    .label {
      font-weight: bold;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      display: block;
    }
  </style>
</head>
<body>
  <h1>Mejora tu mensaje con ChatGPT</h1>

  <label for="input" class="label">Tu mensaje original:</label>
  <textarea id="input" placeholder="Escribe aquí tu mensaje..."></textarea>

  <button onclick="sendMessage()">Mejorar redacción</button>

  <label for="output" class="label">Versión mejorada:</label>
  <textarea id="output" readonly placeholder="Aquí aparecerá la versión optimizada..."></textarea>

  <script src="script.js"></script>
</body>
</html>
